<section class="page-card">
  <!-- <p class="eyebrow">Fleet</p>
  <h1>Driver</h1>
  <p class="lead">Track all registered Drivers and assignments here.</p> -->
<!-- Step: 3 -->
  <div class="page-heading">
    <p class="eyebrow">Fleet</p>
    <h1>Driver</h1>
    <p class="lead">  ETrack all registered Drivers and assignments here. </p>
  </div>

    <form #driverForm="ngForm" class="driver-form"  (ngSubmit)="addDriver()" >

<!-- Step: 4 -->
      <div class="form-grid">
      <div class="form-field">
        <label for="firstName">First Name</label>
        <input
          id="firstName"
          name="firstName"
          type="text"
          placeholder="Enter first name"
          [(ngModel)]="driverfields.firstName"
          (ngModelChange)="driverfields.firstName = $event"

          required
        >
      </div>

      <div class="form-field">
        <label for="middleName">Middle Name</label>
        <input
          id="middleName"
          name="middleName"
          type="text"
          placeholder="Enter middle name"
          [(ngModel)]="driverfields.middleName"
          (ngModelChange)="driverfields.middleName = $event"
        >
      </div>

      <div class="form-field">
        <label for="lastName">Last Name</label>
        <input
          id="lastName"
          name="lastName"
          type="text"
          placeholder="Enter last name"
          [(ngModel)]="driverfields.lastName"
          (ngModelChange)="driverfields.lastName = $event"
          required
        >
      </div>

      <div class="form-field">
        <label for="cnicNumber">CNIC Number</label>
        <input
          id="cnicNumber"
          name="cnicNumber"
          type="text"
          placeholder="12345-1234567-1"
          maxlength="15"
          [(ngModel)]="driverfields.cnicNumber"
          (ngModelChange)="driverfields.cnicNumber = $event"
          required
        >
      </div>

      <div class="form-field">
        <label for="licenseNumber">License Number</label>
        <input
          id="licenseNumber"
          name="licenseNumber"
          type="text"
          placeholder="Enter license number"
          [(ngModel)]="driverfields.licenseNumber"
          (ngModelChange)="driverfields.licenseNumber = $event"
          required
        >
      </div>

      <div class="form-field">
        <label for="phoneNumber">Phone Number</label>
        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          placeholder="0300-1234567"
          [(ngModel)]="driverfields.phoneNumber"
          (ngModelChange)="driverfields.phoneNumber = $any($event.target).value"
          required
        >
        
      </div>
      <div class="form-field"> <p>{{ driverfields.phoneNumber }}</p></div>

<!-- Step: 5  -->

       <div class="form-actions">
      <button type="submit"  class="button button-primary" [disabled]="driverForm.invalid"    >
        Add Driver
      </button>
       </div>
    </div>
  </form>


    <div class="driver-preview">
    <h2>Entered Driver Values</h2>

    <div class="form-grid">
      <div class="form-field">
        <label for="firstNamePreview">First Name</label>
        <input
          id="firstNamePreview"
          type="text"
          [value]="driverfields.firstName"
          readonly
        >
      </div>

      <div class="form-field">
        <label for="middleNamePreview">Middle Name</label>
        <input
          id="middleNamePreview"
          type="text"
          [value]="driverfields.middleName"
          readonly
        >
      </div>

      <div class="form-field">
        <label for="lastNamePreview">Last Name</label>
        <input
          id="lastNamePreview"
          type="text"
          [value]="driverfields.lastName"
          readonly
        >
      </div>

      <div class="form-field">
        <label for="cnicNumberPreview">CNIC Number</label>
        <input
          id="cnicNumberPreview"
          type="text"
          [value]="driverfields.cnicNumber"
          readonly
        >
      </div>

      <div class="form-field">
        <label for="licenseNumberPreview">License Number</label>
        <input
          id="licenseNumberPreview"
          type="text"
          [value]="driverfields.licenseNumber"
          readonly
        >
      </div>

      <div class="form-field">
        <label for="phoneNumberPreview">Phone Number</label>
        <input
          id="phoneNumberPreview"
          type="text"
          [value]="driverfields.phoneNumber"
          readonly
        >
      </div>
    </div>
  </div>
</section>
